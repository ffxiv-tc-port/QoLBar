You can use right click to add special game symbols, additionally,\nthere are custom commands that only work from shortcuts.\n	' //m0 ' - Executes individual macro #0 (up to //m99).\n	' //m100 ' - Executes shared macro #0 (up to //m199).\n	' //m ' - Begins or ends a custom macro. The following lines\nwill execute as a macro instead of a shortcut (allowing for\n/wait, /macrolock, etc), until //m is used again, up to 30 lines.\n	' //i <ID/Name> ' - Uses an item, cannot be used with //m.\n	' // <Comment> ' - Adds a comment.==你可以使用右鍵新增特殊遊戲符號，此外，\n還有一些只能在快捷項目中使用的自訂指令。\n	' //m0 ' - 執行個人巨集 #0（最多到 //m99）。\n	' //m100 ' - 執行共用巨集 #0（最多到 //m199）。\n	' //m ' - 開始或結束自訂巨集。之後的行\n會作為巨集執行而非快捷項目（可使用\n/wait、/macrolock 等），直到再次使用 //m 為止，最多 30 行。\n	' //i <ID/名稱> ' - 使用道具，無法與 //m 一起使用。\n	' // <註解> ' - 新增註解。
