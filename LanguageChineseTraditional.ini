Start or end the name with ::x where x is a number to use icons, i.e. "::2914".\nUse ## anywhere in the name to make the text afterwards into a tooltip,\ni.e. "Name##This is a Tooltip".==在名稱開頭或結尾加上 ::x（x 為數字）以使用圖示，例如「::2914」。\n在名稱中任意位置使用 ## 可將其後的文字變成提示框，\n例如「名稱##這是提示框」。
\n\nIcons accept arguments between "::" and their ID. I.e. "::f21".\n	' f ' - Applies the hotbar frame.\n	' n ' - Removes the hotbar frame.\n	' l ' - Uses the low resolution icon.\n	' h ' - Uses the high resolution icon if it exists.\n	' g ' - Changes the icon to grayscale.\n	' r ' - Reverses the icon.==\n\n圖示可在「::」與其 ID 之間加上參數，例如「::f21」。\n	' f ' - 套用快捷列框架。\n	' n ' - 移除快捷列框架。\n	' l ' - 使用低解析度圖示。\n	' h ' - 若存在則使用高解析度圖示。\n	' g ' - 將圖示轉為灰階。\n	' r ' - 將圖示反轉。
